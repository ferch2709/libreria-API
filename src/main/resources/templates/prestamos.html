<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <!-- Enlace ajustado a préstamos -->
            <a class="navbar-brand brand-mark" th:href="@{/vista/prestamos}">BIBLIOTECA</a>
            <span class="navbar-text text-white-50">Control de Préstamos</span>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administración</p>
                <h1 class="h2 mb-0">Préstamos</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(prestamos)} + ' registrados'">0 registrados</span>
        </header>

        <!-- Mensajes de éxito o error -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Nuevo Préstamo</h2>
                    <!-- Formulario apuntando a guardar préstamo -->
                    <form th:action="@{/vista/prestamos/guardar}" th:object="${prestamo}" method="post">
                        
                        <!-- ID del Libro -->
                        <div class="mb-3">
                            <label class="form-label" for="libroId">ID del Libro (ISBN)</label>
                            <!-- th:field="*{libro.id}" o "*{libro.isbn}" dependiendo de cómo dejaste tu clase LibroModel -->
                            <input id="libroId" class="form-control" th:field="*{libro.id}" required>
                        </div>
                        
                        <!-- ID del Usuario -->
                        <div class="mb-3">
                            <label class="form-label" for="usuarioId">ID del Socio/Usuario</label>
                            <input id="usuarioId" class="form-control" th:field="*{usuario.id}" required>
                        </div>

                        <!-- Fecha de Préstamo -->
                        <div class="mb-3">
                            <label class="form-label" for="fechaPrestamo">Fecha de Préstamo</label>
                            <input id="fechaPrestamo" class="form-control" type="date" th:field="*{fechaPrestamo}" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Registrar Préstamo</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Listado de Préstamos</h2>
                        <input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar por socio o libro">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPrestamos">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Libro</th>
                                    <th>Socio</th>
                                    <th>F. Préstamo</th>
                                    <th>F. Devolución</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${prestamos}">
                                    <td th:text="${item.id}"></td>
                                    <!-- Si el libro/usuario existen, muestra su titulo/nombre, si no muestra un texto por defecto -->
                                    <td th:text="${item.libro != null ? item.libro.titulo : 'N/A'}"></td>
                                    <td th:text="${item.usuario != null ? item.usuario.nombre : 'N/A'}"></td>
                                    <td th:text="${item.fechaPrestamo}"></td>
                                    <td>
                                        <span th:if="${item.fechaDevolucion == null}" class="badge bg-warning text-dark">Pendiente</span>
                                        <span th:if="${item.fechaDevolucion != null}" th:text="${item.fechaDevolucion}"></span>
                                    </td>
                                    <td class="text-end text-nowrap">
                                        <!-- Botón de devolver -->
                                        <button class="btn btn-outline-success btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#devolver-' + ${item.id}">Devolver</button>
                                        
                                        <!-- Botón de eliminar -->
                                        <form class="d-inline" th:action="@{/vista/prestamos/{id}/eliminar(id=${item.id})}" method="post">
                                            <button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('¿Eliminar este registro de préstamo?')">Eliminar</button>
                                        </form>
                                    </td>

                                    <!-- Modal de Devolución (Actualizar préstamo) -->
                                    <div class="modal fade" th:id="'devolver-' + ${item.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <form th:action="@{/vista/prestamos/{id}/actualizar(id=${item.id})}" method="post">
                                                    <!-- Campos ocultos para no perder la relación -->
                                                    <input type="hidden" name="libro.id" th:value="${item.libro != null ? item.libro.id : ''}">
                                                    <input type="hidden" name="usuario.id" th:value="${item.usuario != null ? item.usuario.id : ''}">
                                                    <input type="hidden" name="fechaPrestamo" th:value="${item.fechaPrestamo}">
                                                    
                                                    <div class="modal-header">
                                                        <h3 class="modal-title fs-5">Registrar Devolución</h3>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <p>Confirmar la devolución del libro <strong><span th:text="${item.libro != null ? item.libro.titulo : ''}"></span></strong>.</p>
                                                        <div class="mb-3">
                                                            <label class="form-label">Fecha de Devolución</label>
                                                            <input class="form-control" name="fechaDevolucion" type="date" required>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                                        <button class="btn btn-success" type="submit">Confirmar Devolución</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </tr>
                                <tr th:if="${#lists.isEmpty(prestamos)}">
                                    <td colspan="6" class="text-center text-secondary py-4">No hay préstamos registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPrestamos tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
